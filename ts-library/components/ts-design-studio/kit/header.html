<header class="hd{{#v_center}} hd--center{{/v_center}}"><div class="wrap hd-in">
<a class="brand" href="#obsah"><b>{{brand}}</b>{{#tagline}}<small>{{tagline}}</small>{{/tagline}}</a>
<button type="button" class="hd-menu" aria-expanded="false" aria-controls="hd-nav" aria-label="Menu"><span></span><span></span><span></span></button>
<nav id="hd-nav" class="hd-nav" aria-label="Menu">{{#nav}}<a href="{{href}}">{{label}}</a>{{/nav}}</nav>
<div class="hd-act"><button type="button" class="hd-theme" aria-label="Světlý nebo tmavý režim"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>{{#cta_label}}<a class="btn btn-s" href="{{cta_url}}">{{cta_label}}</a>{{/cta_label}}</div>
</div></header>
