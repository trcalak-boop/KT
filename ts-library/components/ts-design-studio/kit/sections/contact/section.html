<div class="co">{{>head}}<div class="co-b">
{{#phone}}<a class="co-big disp" href="tel:{{phone}}">{{phone}}</a>{{/phone}}{{#email}}<a class="co-big disp" href="mailto:{{email}}">{{email}}</a>{{/email}}
{{#address}}<p class="co-a">{{address}}</p>{{/address}}{{#note}}<p class="muted">{{note}}</p>{{/note}}
{{#map_label}}<a class="arrow" href="{{map_url}}">{{map_label}} →</a>{{/map_label}}
{{#hours}}<p class="co-h"><span>{{days}}</span> <span class="mono">{{time}}</span></p>{{/hours}}
</div></div>
