<footer class="ft tone-band{{#f_simple}} ft--simple{{/f_simple}}"><div class="wrap ft-in">
<div class="ft-brand"><b>{{brand}}</b>{{#tagline}}<p>{{tagline}}</p>{{/tagline}}</div>
{{#f_columns}}<nav class="ft-col" aria-label="Menu">{{#nav}}<a href="{{href}}">{{label}}</a>{{/nav}}</nav>{{/f_columns}}
<div class="ft-col ft-kontakt">{{#address}}<p>{{address}}</p>{{/address}}{{#phone}}<a href="tel:{{phone}}">{{phone}}</a>{{/phone}}{{#email}}<a href="mailto:{{email}}">{{email}}</a>{{/email}}</div>
<p class="ft-legal">© {{year}} {{brand}}{{#legal}} · {{legal}}{{/legal}}</p>
</div></footer>
